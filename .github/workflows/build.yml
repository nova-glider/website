name: Build and Push Docker Image
on:  
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: false
        default: "manual"
env:  
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:  
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:  
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # If it's a tag, remove the 'v' and tag it with the version (without 'v')
            type=raw,value=${{ github.ref | replace('refs/tags/v', '') }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Only tag as latest for GitHub tag references
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            # For manual dispatch with version input (remove 'v' if present)
            type=raw,value=${{ github.event.inputs.version | replace('v', '') }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
